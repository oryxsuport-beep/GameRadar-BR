<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GameRadar BR</title><style>
*{box-sizing:border-box}body{background:#000;color:#eee;font:15px system-ui;margin:0}header,main,footer{max-width:1180px;margin:auto;padding:20px}header{border-bottom:1px solid #292929}b.logo{font-size:26px;letter-spacing:-1px}em{color:#ff334b;font-style:normal}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button,input,select{font:inherit;border:1px solid #333;background:#151515;color:#eee;border-radius:8px;padding:11px}button,a{cursor:pointer}button:hover{border-color:#ff334b}button.primary,a.buy{background:#d91c39;border:0;color:white;font-weight:bold}a{color:#ff6577}a.buy{display:inline-block;padding:10px;border-radius:8px;text-decoration:none}.hero{padding:28px;background:radial-gradient(ellipse at top right,#480c19,#101010 65%);border:1px solid #38202a;border-radius:18px}h1{font-size:clamp(30px,5vw,58px);line-height:1.05;margin:12px 0}p,small{color:#aaa}form,.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}input{flex:1;min-width:140px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card,.panel{background:#111;border:1px solid #252525;border-radius:12px;padding:15px}.cover{width:100%;aspect-ratio:2.15;object-fit:cover;background:#222;border-radius:7px}.price{color:#53df91;font-weight:bold;font-size:22px}.line{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #292929;padding:13px 0;flex-wrap:wrap}.line[hidden]{display:none}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.warn{color:#ffc477}footer{border-top:1px solid #222;color:#aaa}@media(max-width:480px){header,main,footer{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{padding:9px}.hero{padding:20px}}
</style><header><b class="logo">◉ GAME<em>RADAR</em> BR</b><nav id="nav"></nav></header><main><section class="hero"><small>O RADAR DE ECONOMIA GAMER</small><h1>Jogue mais.<br><em>Pague menos.</em></h1><p>Ofertas internacionais em USD e Steam Brasil em BRL. Consulte região e taxas antes da compra.</p><form id="search"><input id="q" required placeholder="Qual jogo você procura?"><button class="primary">Buscar jogos</button></form></section><div id="view" aria-live="polite"></div></main><footer>Dados internacionais: <a href="https://www.cheapshark.com/">CheapShark</a>. Steam Brasil: endpoint público não oficial. Atalhos externos não consultam preços automaticamente.</footer><script>
const $=id=>document.getElementById(id),view=$('view'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),usd=v=>v!=null&&Number.isFinite(Number(v))?'US$ '+Number(v).toFixed(2):'Indisponível',br=v=>'R$ '+(v/100).toFixed(2).replace('.',','),link=id=>'https://www.cheapshark.com/redirect?dealID='+encodeURIComponent(id),read=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));let fav=read('gr-fav',{}),alerts=read('gr-alert',{}),stores=[],items=[],current='Ofertas',seq=0;
async function api(p,q={}){let r=await fetch('/api/'+p+'?'+new URLSearchParams(q)),v=await r.json();if(!r.ok)throw Error(v.error||'Falha na consulta');return v}function error(e){view.innerHTML='<p class="warn">'+esc(e.message)+' — tente novamente.</p>'}function loading(){view.innerHTML='<p>Consultando fontes reais…</p>'}function store(id){return stores.find(s=>s.storeID==id)?.storeName||'Loja '+id}const buttons=['Ofertas','Grátis','Favoritos','Alertas','Lojas','Orçamento'];$('nav').innerHTML=buttons.map(t=>'<button data-tab="'+t+'">'+t+'</button>').join('');
const extraStores=[['Steam','store.steampowered.com','Oficial'],['Epic Games','store.epicgames.com','Oficial'],['Xbox','xbox.com','Oficial'],['PlayStation','store.playstation.com','Oficial'],['GOG','gog.com','Oficial'],['Ubisoft','store.ubisoft.com','Oficial'],['EA','ea.com','Oficial'],['Nintendo','nintendo.com','Oficial'],['Nuuvem','nuuvem.com','Revendedora'],['Fanatical','fanatical.com','Revendedora'],['Humble Bundle','humblebundle.com','Revendedora'],['Green Man Gaming','greenmangaming.com','Revendedora'],['Gamesplanet','gamesplanet.com','Revendedora'],['GameBillet','gamebillet.com','Revendedora'],['IndieGala','indiegala.com','Revendedora'],['Gamesload','gamesload.com','Revendedora'],['Eneba','eneba.com','Marketplace'],['Kinguin','kinguin.net','Marketplace'],['G2A','g2a.com','Marketplace'],['Gamivo','gamivo.com','Marketplace'],['Instant Gaming','instant-gaming.com','Independente'],['CDKeys / Loaded','loaded.com','Independente']];
function directory(q=''){return '<h2>Pesquisar em outras lojas</h2><p>Atalhos externos, sem comparação automática. Confirme região, edição, taxas e reputação. Evite comprar contas compartilhadas.</p><select id="storefilter"><option value="">Todas as categorias</option>'+[...new Set(extraStores.map(x=>x[2]))].map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><div class="panel">'+extraStores.map(([n,d,t])=>'<div class="line" data-type="'+esc(t)+'"><span><b>'+esc(n)+'</b><br><small>'+esc(t)+'</small></span><a class="buy" target="_blank" rel="noopener" href="'+(q?'https://www.google.com/search?q='+encodeURIComponent('site:'+d+' '+q):'https://'+d)+'">'+(q?'Pesquisar jogo':'Abrir loja')+'</a></div>').join('')+'</div>'}
function bindDirectory(){let f=$('storefilter');if(f)f.onchange=()=>document.querySelectorAll('[data-type]').forEach(r=>r.hidden=!!f.value&&r.dataset.type!==f.value)}
function normalize(g){return {id:String(g.gameID),name:g.external||g.title,price:g.cheapest??g.salePrice,thumb:g.thumb,steam:g.steamAppID,store:g.storeID}}
function cards(list,title){items=list;view.innerHTML='<h2>'+esc(title)+'</h2><select id="sort"><option value="default">Ordem original</option><option value="cheap">Menor preço USD</option></select><div class="grid" id="cards" style="margin-top:12px"></div>';draw(list);$('sort').onchange=()=>draw($('sort').value==='cheap'?[...list].sort((a,b)=>a.price-b.price):list)}
function draw(list){$('cards').innerHTML=list.length?list.map(g=>'<article class="card"><img class="cover" loading="lazy" src="'+(/^https:\/\//.test(g.thumb||'')?esc(g.thumb):'')+'" alt=""><h3>'+esc(g.name)+'</h3><small>'+esc(g.store?store(g.store):'Menor preço internacional')+' · PC</small><div class="price">'+usd(g.price)+'</div><div class="actions"><button data-game="'+esc(g.id)+'">Comparar</button><button data-fav="'+esc(g.id)+'" aria-label="Favoritar">'+(fav[g.id]?'♥':'♡')+'</button></div></article>').join(''):'<p>Nenhum resultado nesta seleção.</p>'}
async function home(tab){current=tab;let token=++seq;loading();try{if(tab==='Favoritos'){cards(Object.values(fav),'Favoritos');return}if(tab==='Lojas'){view.innerHTML='<h2>Lojas da CheapShark</h2><div class="panel">'+stores.filter(s=>s.isActive==1).map(s=>'<div class="line">'+esc(s.storeName)+'</div>').join('')+'</div>'+directory();bindDirectory();return}if(tab==='Alertas'){view.innerHTML='<h2>Alertas locais em USD</h2><p>Verificados ao abrir esta aba, sem notificações automáticas.</p><div id="alerts">Verificando…</div>';let rows=await Promise.all(Object.values(alerts).map(async a=>{try{let d=await api('game',{id:a.id}),p=Math.min(...d.deals.map(x=>Number(x.price)));return '<div class="line">'+esc(a.name)+' · Meta '+usd(a.target)+' · Atual '+usd(p)+(p<=a.target?' — META ATINGIDA':'')+'<button data-remove="'+esc(a.id)+'">Excluir</button></div>'}catch{return '<p>'+esc(a.name)+' — indisponível</p>'}}));if(token===seq)$('alerts').innerHTML=rows.join('')||'Nenhum alerta.';return}if(tab==='Orçamento'){view.innerHTML='<h2>Orçamento internacional</h2><form id="budget"><input type="number" min="0" step="0.01" required placeholder="Limite em USD"><button class="primary">Encontrar</button></form>';$('budget').onsubmit=async e=>{e.preventDefault();let v=Number(e.target.querySelector('input').value);loading();try{let d=await api('deals');if(token===seq)cards(d.map(normalize).filter(g=>Number(g.price)<=v),'Ofertas no orçamento (amostra)')}catch(e){if(token===seq)error(e)}};return}let d=await api('deals');if(token===seq)cards(d.map(normalize).filter(g=>tab!=='Grátis'||Number(g.price)===0),tab==='Grátis'?'Ofertas gratuitas na amostra':'Ofertas em destaque')}catch(e){if(token===seq)error(e)}}
$('search').onsubmit=async e=>{e.preventDefault();let token=++seq,q=$('q').value;current='Busca';loading();try{let d=await api('search',{q});if(token===seq)cards(d.map(normalize),'Resultados da busca')}catch(e){if(token===seq)error(e)}if(token===seq){view.insertAdjacentHTML('beforeend',directory(q));bindDirectory()}};
async function detail(id){let token=++seq;current='Detalhes';loading();try{let d=await api('game',{id});if(token!==seq)return;let g={id,name:d.info.title,thumb:d.info.thumb,steam:d.info.steamAppID,price:Math.min(...d.deals.map(x=>Number(x.price)))};items=[g];view.innerHTML='<h2>'+esc(g.name)+'</h2><div class="panel">Menor preço histórico internacional: '+usd(d.cheapestPriceEver?.price)+' <button data-fav="'+esc(id)+'">'+(fav[id]?'♥':'♡')+'</button></div><h2>Ofertas internacionais (USD)</h2><p class="warn">Ativação no Brasil e taxas não confirmadas.</p><div class="panel">'+[...d.deals].sort((a,b)=>a.price-b.price).map(x=>'<div class="line"><span>'+esc(store(x.storeID))+'<br><small>Original '+usd(x.retailPrice)+'</small></span><b class="price">'+usd(x.price)+'</b><a class="buy" target="_blank" rel="noopener" href="'+esc(link(x.dealID))+'">Ver oferta</a></div>').join('')+'</div><h2>Steam Brasil</h2><div class="panel" id="br">'+(g.steam?'Consultando…':'Sem ID Steam associado.')+'</div><h2>Alerta local</h2><form id="target"><input type="number" min="0" step="0.01" required placeholder="Preço desejado em USD"><button class="primary">Salvar alerta</button></form><p id="msg"></p><h2>Histórico observado neste navegador</h2><div id="hist" class="panel"></div>'+directory(g.name);bindDirectory();let h=read('gr-hist',{}),today=new Date().toISOString().slice(0,10);h[id]=[...(h[id]||[]).filter(x=>x.date!==today),{date:today,price:g.price}].slice(-365);save('gr-hist',h);$('hist').innerHTML=h[id].map(x=>'<div class="line">'+esc(x.date)+' <b>'+usd(x.price)+'</b></div>').join('');$('target').onsubmit=e=>{e.preventDefault();alerts[id]={id,name:g.name,target:Number(e.target.querySelector('input').value)};save('gr-alert',alerts);$('msg').textContent='Alerta salvo neste navegador.'};if(g.steam){try{let s=await api('br',{id:g.steam});if(token!==seq)return;let p=s?.price_overview;$('br').innerHTML=s?'<div class="line"><b class="price">'+(s.is_free?'Grátis':p?.currency==='BRL'?br(p.final):'Preço brasileiro indisponível')+'</b><a class="buy" target="_blank" rel="noopener" href="https://store.steampowered.com/app/'+encodeURIComponent(g.steam)+'/">Steam</a></div><h3>Requisitos mínimos</h3><p>'+esc(s.pc_requirements?.minimum?.replace(/<[^>]*>/g,' ')||'Não informado')+'</p>':'Sem dados regionais.'}catch(e){if(token===seq)$('br').textContent='Steam indisponível.'}}}catch(e){if(token===seq)error(e)}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab)home(d.tab);if(d.game)detail(d.game);if(d.fav){let g=items.find(x=>x.id===d.fav);if(fav[d.fav])delete fav[d.fav];else if(g)fav[d.fav]=g;save('gr-fav',fav);b.textContent=fav[d.fav]?'♥':'♡';if(current==='Favoritos')home('Favoritos')}if(d.remove){delete alerts[d.remove];save('gr-alert',alerts);home('Alertas')}});api('stores').then(s=>{stores=s;home('Ofertas')}).catch(()=>home('Ofertas'));
</script></html>
